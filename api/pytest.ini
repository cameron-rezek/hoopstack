[pytest]
testpaths = tests
# rootdir is api/, so this puts the repo root on sys.path — the app imports
# absolutely (`from api.config import ...`) and needs the parent as the root.
pythonpath = ..
# Every test in this suite is async; `auto` avoids an @pytest.mark.asyncio
# decorator on each one.
asyncio_mode = auto
addopts = -q --strict-markers
